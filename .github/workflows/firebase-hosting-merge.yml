name: Deploy to Firebase Hosting on push to main

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug firebase deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npm install -g firebase-tools >> /tmp/deploy.log 2>&1
          firebase deploy --only hosting --project diet-tool-dd7a9 --debug --non-interactive >> /tmp/deploy.log 2>&1
          echo "EXITCODE=$?" >> /tmp/deploy.log
          set -e
          tail -c 55000 /tmp/deploy.log > /tmp/deploy_tail.log
          jq -Rs '{title:"deploy debug log", body: ("```\n" + . + "\n```")}' /tmp/deploy_tail.log > /tmp/issue_payload.json
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" -d @/tmp/issue_payload.json
