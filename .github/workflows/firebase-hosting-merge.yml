# Deploys to Firebase Hosting every time you push to the main branch.
#
# Requires one GitHub repository secret:
#   FIREBASE_SERVICE_ACCOUNT — the full JSON content of a Firebase service
#   account key (Firebase console → プロジェクトの設定 → サービス アカウント →
#   新しい秘密鍵の生成). Add it under
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret.
#
# Also replace YOUR_FIREBASE_PROJECT_ID below with your actual Firebase project ID.

name: Deploy to Firebase Hosting on push to main

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: YOUR_FIREBASE_PROJECT_ID
